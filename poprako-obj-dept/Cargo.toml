[package]
name = "poprako-obj-dept"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
rdb_impl = [
    "dep:diesel",
    "dep:diesel-async",
    "dep:poprako-obj-dept-macro",
    "dep:poprako-rdb-core",
]

[dependencies]
diesel = { version = "2.4.0", features = ["postgres", "serde_json", "time", "uuid"], optional = true }
diesel-async = { version = "0.10.0", features = ["postgres"], optional = true }
futures-util = "0.3.34"
poprako-orchestra = { version = "0.6.0", features = ["macro"] }
poprako-obj-dept-macro = { path = "../poprako-obj-dept-macro", optional = true }
poprako-rdb-core = { path = "../poprako-rdb-core", optional = true }
serde_json.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
time = "0.3.55"
tracing = "0.1.44"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "test-util", "time"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
url = "2.5.8"
uuid.workspace = true
