[package]
name = "poprako-r"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
diesel = { version = "2.3.7", features = ["postgres", "time"] }
diesel-async = { version = "0.9.0", features = ["deadpool", "postgres"] }
dotenvy = "0.15.7"
futures-util = "0.3.32"
salvo = { version = "0.92.2", features = ["oapi"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.52.1", features = ["full", "macros"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"
uuid = { version = "1.23.1", features = ["v7"] }
