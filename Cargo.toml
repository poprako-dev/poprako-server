[workspace]
members = [".", "poprako-util", "poprako-swagger"]
resolver = "3"

[package]
name = "poprako-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Event-driven backend service for manga translation project management"
license = "MIT"
repository = "https://github.com/poprako-dev/poprako-server"
keywords = ["manga", "translation", "backend", "axum", "diesel"]
categories = ["web-programming", "asynchronous"]
publish = false

[lints.clippy]
mod_module_files = "deny"

[features]
benchmark = []
rdb = []
prom_impl = []
repo_impl = []
swagger = ["utoipa-swagger-ui", "utoipa"]

[dependencies]
anyhow = "1.0.102"
aws-config = { version = "1" }
aws-credential-types = { version = "1" }
aws-sdk-s3 = { version = "1" }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["query"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
argon2 = "0.5"
cookie = "0.18"
crossfire = { version = "3.1.16", features = ["tokio"] }
diesel = { version = "2.3.7", features = ["postgres", "serde_json", "time"] }
diesel-async = { version = "0.9.0", features = ["deadpool", "postgres"] }
dotenvy = "0.15.7"
fluent-templates = "0.14.0"
futures-util = "0.3.32"
jsonwebtoken = { version = "10.4.0", features = ["rust_crypto"] }
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
base62 = "2.2.4"
base64 = "0.22"
k-snowflake = "2.1.1"
poprako-util = { path = "poprako-util" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.52.1", features = ["full", "macros"] }
tokio-util = { version = "0.7.18", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
unic-langid = "0.9.6"
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["axum"], optional = true }
governor = "0.6"
futures = "0.3.32"
poprako-orchestra = { version = "0.2.3", features = ["macro", "oper_ext"] }
poprako-orchestra-extra = { version = "0.2.0", features = ["promise"] }

[dev-dependencies]
criterion = { version = "0.7", features = ["async_tokio"] }
diesel_migrations = "2.3.0"
serial_test = "3.5.0"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[[bench]]
name = "test_benchmark"
harness = false
required-features = ["benchmark"]
