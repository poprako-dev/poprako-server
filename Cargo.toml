[workspace]
members = [".", "poprako-macro", "poprako-transactional", "poprako-util"]
resolver = "3"

[package]
name = "poprako-r"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
aws-config = { version = "1" }
aws-credential-types = { version = "1" }
aws-sdk-s3 = { version = "1" }
axum = "0.8.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["request-id", "trace"] }
argon2 = "0.5"
cookie = "0.18"
crossfire = { version = "3.1.16", features = ["tokio"] }
diesel = { version = "2.3.7", features = ["postgres", "serde_json", "time"] }
diesel-async = { version = "0.9.0", features = ["deadpool", "postgres"] }
dotenvy = "0.15.7"
fluent-templates = "0.14.0"
futures-util = "0.3.32"
jsonwebtoken = "10.4.0"
base62 = "2.2.4"
k-snowflake = "2.1.1"
poprako-macro = { path = "poprako-macro" }
poprako-transactional = { path = "poprako-transactional" }
poprako-util = { path = "poprako-util" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
time = { version = "0.3.47", features = ["serde"] }
tokio = { version = "1.52.1", features = ["full", "macros"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
unic-langid = "0.9.6"
url = "2.5.8"
utoipa = { version = "5.5.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum"] }
futures = "0.3.32"
