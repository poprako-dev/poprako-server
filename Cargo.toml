[workspace]
members = [
    ".",
    "poprako-util",
    "poprako-swagger",
    "poprako-obj-dept",
    "poprako-obj-dept-macro",
    "poprako-rdb-core",
    "poprako-prom",
]
default-members = ["."]
resolver = "3"

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.95"
license = "AGPL-3.0-only"
repository = "https://github.com/poprako-dev/poprako-server"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
deadpool = { version = "0.13.1", features = ["rt_tokio_1"] }
fluent-templates = "0.15.1"
metrics = "0.24.6"
serde_json = "1.0.154"
time = "0.3.55"
toml = "1.2.1"
unic-langid = "0.9.6"
utoipa = "6.0.0"
uuid = "1.29.2"

[workspace.lints.rust]
warnings = "deny"
unsafe_code = "forbid"
# Async closures are stable, so a closure whose whole body is an `async` block
# must be written as one; the lint is allow-by-default.
closure_returning_async_block = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
indexing_slicing = "deny"
string_slice = "deny"
mod_module_files = "deny"
allow_attributes_without_reason = "deny"
# The custom no-inline-format checker forbids inline captures, so Clippy must
# not require them. Keep this specific lint overridden; pedantic enables it.
uninlined_format_args = "allow"

[package]
name = "poprako-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Event-driven backend service for manga translation project management"
license.workspace = true
repository.workspace = true
keywords = ["manga", "translation", "backend", "axum", "diesel"]
categories = ["web-programming", "asynchronous"]
publish.workspace = true

[lints]
workspace = true

[features]
benchmark = []
rdb = []
prom_impl = []
repo_impl = []
swagger = ["utoipa-swagger-ui", "utoipa"]

[dependencies]
anyhow.workspace = true
async-trait = "0.1.92"
aws-credential-types = { version = "1.3.1" }
aws-sdk-s3 = { version = "1.159.0", default-features = false, features = [
    "default-https-client",
    "http-1x",
    "rt-tokio",
] }
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["query"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = [
    "compression-gzip",
    "cors",
    "request-id",
    "trace",
] }
argon2 = "0.6.0"
cookie = "0.18.2"
dashmap = "6.2.1"
diesel = { version = "2.4.0", features = [
    "postgres",
    "serde_json",
    "time",
    "uuid",
] }
diesel-async = { version = "0.10.0", features = ["deadpool", "postgres"] }
dotenvy = "0.15.7"
fluent-templates.workspace = true
futures-util = "0.3.34"
fundu = "2.1.1"
jsonwebtoken = { version = "12.0.0", default-features = false, features = [
    "aws_lc_rs",
] }
metrics.workspace = true
moka = { version = "0.12.16", features = ["sync"] }
metrics-exporter-prometheus = "0.18.3"
base62 = "2.2.6"
base64 = "0.23.1"
k-snowflake = "2.1.1"
poprako-util = { path = "poprako-util" }
poprako-obj-dept = { path = "poprako-obj-dept", features = ["rdb_impl"] }
poprako-rdb-core = { path = "poprako-rdb-core" }
poprako-orchestra-extra = { version = "0.3.0", features = ["promise"] }
poprako-prom = { path = "poprako-prom", features = ["rdb_impl"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json.workspace = true
sha2 = "0.11.1"
time = { workspace = true, features = ["serde"] }
tokio = { version = "1.54.1", features = ["full", "macros"] }
tokio-util = { version = "0.7.20", features = ["io", "rt"] }
toml.workspace = true
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "time"] }
unic-langid.workspace = true
url = "2.5.8"
uuid.workspace = true
veil = "0.3.0"
utoipa = { workspace = true, features = ["axum_extras"], optional = true }
utoipa-swagger-ui = { version = "10.0.2", features = [
    "axum",
    "vendored",
], optional = true }
governor = "0.10.4"
poprako-orchestra = { version = "0.6.0", features = ["macro", "oper_ext"] }

[dev-dependencies]
criterion = { version = "0.8.2", features = ["async_tokio"] }
diesel_migrations = "2.4.0"
serial_test = "4.0.1"
testcontainers-modules = { version = "0.15.0", features = ["postgres"] }

[[bench]]
name = "test_benchmark"
harness = false
required-features = ["benchmark"]
