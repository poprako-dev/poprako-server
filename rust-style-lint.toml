# Actor message abstractions must use role-specific names. These restrictions
# apply to type and field names as well as bindings and functions.
# Compound names use prefix checks because the checker splits them into words.
[[forbidden-identifiers.prefixes]]
prefix = "FnHandler"
code = "FBD023"
message = "'{name}' uses the forbidden FnHandler name; use Dispatcher"
contexts = [
    "module",
    "function",
    "let",
    "parameter",
    "const",
    "static",
    "enum_variant",
    "type",
    "field",
    "macro_field",
