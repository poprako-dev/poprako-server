# PopRaKo's selection and configuration for the shared rust-style-lint
# checker suite. The A/B-tier checkers run via `rust-style-lint` (see
# linters-extra/run-check.sh); this file selects which linters run and carries the
# project-specific rule parameters.

[linters]
no-allow = true
no-inline-format = true
no-inline-tests = true
spacing-style = true
use-style = true
generic-where = true
no-type-hint = true
no-redundant-destructure = true
item-layout = true
doc-comment-coverage = true
forbidden-identifiers = true
module-dependency = true
visibility-style = true
trait-use-anonymous = true
prefer-if-let-guard = true
no-unnamed-fields = true

[qualified-call-site]
enforced_std_paths = ["std::env::var", "std::result::Result"]
exempt_poprako_paths = ["poprako_server::serve", "poprako_server::init_log"]
enforced_third_party_paths = [
    "jsonwebtoken::encode",
    "jsonwebtoken::decode",
    "serde_json::Value",
]

# --- per-checker overrides ------------------------------------------------

# Diesel generates schema.rs; it is not hand-authored Rust.
[spacing-style]
ignore_dirs = [
    ".git",
    ".hg",
    ".svn",
    ".idea",
    ".vscode",
    "target",
    "node_modules",
    "schema.rs",
]

[generic-where]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[item-layout]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[module-dependency]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[visibility-style]
# Modules whose public struct fields are part of the data contract.
allow_public_fields = [
    "model",
    "shape",
    "data",
    "config",
    "value",
    "api::http::handler",
    "api::http::shared::metric",
    "complex::page::manifest",
    "part::image",
    "part::prom",
    "part::repo::oper",
    "part::effect::event",
    "part::prom::payload::chapter",
    "part_impl::repo::rdb_impl::entity",
    "part_impl::prom::rdb_impl::entity",
    "part_impl::prom::rdb_impl::handler",
    "key",
    "oper",
    "rdb_impl",
]
exclude_files = ["src/part_impl/repo/rdb_impl/schema.rs"]

[forbidden-identifiers]
# The words table replaces the packaged defaults entirely.
exclude_filenames = ["schema.rs"]

# Every hand-authored repository and term module participates in identifier checks.
skip_module_paths = []
ignore_files = []

[[forbidden-identifiers.words]]
word = "result"
code = "FBD001"
contexts = [
    "function",
    "let",
    "parameter",
    "const",
    "static",
    "enum_variant",
]

