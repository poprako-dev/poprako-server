name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_production_image:
        description: Build the production image without deploying it
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ci-all-features
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust checks
        run: >-
          sh scripts/ci-parallel.sh
          "Rust workspace checks" "sh scripts/ci-check.sh"
          "Rust workspace tests" "sh scripts/ci-test.sh"
          "OpenAPI specification" "sh scripts/ci-openapi-check.sh"

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Type-check HTTP integration suite
        run: sh scripts/ci-typecheck.sh

  migrations:
    name: Diesel migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: db_poprako_ci
          POSTGRES_PASSWORD: poprako
          POSTGRES_USER: poprako
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poprako -d db_poprako_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_MIGRATION_DATABASE: "1"
      DATABASE_URL: postgres://poprako:poprako@127.0.0.1:5432/db_poprako_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate Diesel migrations
        run: sh scripts/ci-migration-check.sh

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit Rust dependencies
        run: sh scripts/ci-audit.sh

  production-image:
    name: Production image
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_production_image)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      image_digest: ${{ steps.build.outputs.image_digest }}
      image_ref: ${{ steps.build.outputs.image_ref }}

    steps:
      - name: Check out image source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish production image
        id: build
        env:
          BUILD_METADATA_FILE: ${{ runner.temp }}/poprako-build-metadata.json
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          CACHE_FROM: type=registry,ref=ghcr.io/poprako-dev/poprako-server:buildcache
          CACHE_TO: type=registry,ref=ghcr.io/poprako-dev/poprako-server:buildcache,mode=max,image-manifest=true,oci-mediatypes=true,ignore-error=true
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE_NAME: ghcr.io/poprako-dev/poprako-server:sha-${{ github.sha }}
        run: sh scripts/ci-build-prod.sh

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - migrations
      - production-image
      - rust
      - security
      - typescript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    environment:
      name: production

    env:
      DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      DEPLOY_BIND_HOST: ${{ secrets.DEPLOY_BIND_HOST }}
      DEPLOY_DOCKER_NETWORK: ${{ secrets.DEPLOY_DOCKER_NETWORK }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_POSTGRES_CONTAINER: ${{ secrets.DEPLOY_POSTGRES_CONTAINER }}
      DEPLOY_PUBLIC_PORT: ${{ secrets.DEPLOY_PUBLIC_PORT }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_SOURCE_IMAGE: ${{ needs.production-image.outputs.image_ref }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      GHCR_TOKEN: ${{ github.token }}
      GHCR_USERNAME: ${{ github.actor }}
      JWT_EXPIRATION_HOURS: ${{ secrets.DEPLOY_JWT_EXPIRATION_HOURS }}
      JWT_SECRET: ${{ secrets.DEPLOY_JWT_SECRET }}
      POPRAKO_SNOWFLAKE_NODE_ID: ${{ secrets.DEPLOY_POPRAKO_SNOWFLAKE_NODE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.DEPLOY_R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.DEPLOY_R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.DEPLOY_R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ secrets.DEPLOY_R2_CUSTOM_DOMAIN }}
      R2_REGION: ${{ secrets.DEPLOY_R2_REGION }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}

      - name: Deploy published image
        run: sh scripts/ci-deploy-production.sh
