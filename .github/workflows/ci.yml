name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check Rust workspace
        run: sh scripts/ci-check.sh

      - name: Test Rust workspace
        run: sh scripts/ci-test.sh

      - name: Check OpenAPI specification
        run: sh scripts/ci-openapi-check.sh

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Type-check HTTP integration suite
        run: sh scripts/ci-typecheck.sh

  migrations:
    name: Diesel migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: poprako_ci
          POSTGRES_PASSWORD: poprako
          POSTGRES_USER: poprako
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poprako -d poprako_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_MIGRATION_DATABASE: "1"
      DATABASE_URL: postgres://poprako:poprako@127.0.0.1:5432/poprako_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate Diesel migrations
        run: sh scripts/ci-migration-check.sh

  security:
    name: Dependency security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Audit Rust dependencies
        run: sh scripts/ci-audit.sh

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - migrations
      - rust
      - security
      - typescript
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: production

    env:
      DATABASE_URL: ${{ secrets.DEPLOY_DATABASE_URL }}
      DEPLOY_BIND_HOST: ${{ secrets.DEPLOY_BIND_HOST }}
      DEPLOY_DOCKER_NETWORK: ${{ secrets.DEPLOY_DOCKER_NETWORK }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_POSTGRES_CONTAINER: ${{ secrets.DEPLOY_POSTGRES_CONTAINER }}
      DEPLOY_PUBLIC_PORT: ${{ secrets.DEPLOY_PUBLIC_PORT }}
      DEPLOY_ROOT: ${{ secrets.DEPLOY_ROOT }}
      DEPLOY_SHA: ${{ github.sha }}
      DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      JWT_EXPIRATION_HOURS: ${{ secrets.DEPLOY_JWT_EXPIRATION_HOURS }}
      JWT_SECRET: ${{ secrets.DEPLOY_JWT_SECRET }}
      POPRAKO_SNOWFLAKE_NODE_ID: ${{ secrets.DEPLOY_POPRAKO_SNOWFLAKE_NODE_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.DEPLOY_R2_ACCESS_KEY_ID }}
      R2_ACCOUNT_ID: ${{ secrets.DEPLOY_R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.DEPLOY_R2_BUCKET_NAME }}
      R2_CUSTOM_DOMAIN: ${{ secrets.DEPLOY_R2_CUSTOM_DOMAIN }}
      R2_REGION: ${{ secrets.DEPLOY_R2_REGION }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.DEPLOY_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out deployed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Build, upload, and deploy
        run: sh scripts/ci-deploy-production.sh
