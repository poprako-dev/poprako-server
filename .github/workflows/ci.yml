name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check Rust workspace
        run: sh scripts/ci-check.sh

      - name: Test Rust workspace
        run: sh scripts/ci-test.sh

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Type-check HTTP integration suite
        run: sh scripts/ci-typecheck.sh

  migrations:
    name: Diesel migrations
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: poprako_ci
          POSTGRES_PASSWORD: poprako
          POSTGRES_USER: poprako
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poprako -d poprako_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CI_MIGRATION_DATABASE: "1"
      DATABASE_URL: postgres://poprako:poprako@127.0.0.1:5432/poprako_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Validate Diesel migrations
        run: sh scripts/ci-migration-check.sh
