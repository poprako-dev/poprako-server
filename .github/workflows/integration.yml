name: Full HTTP integration

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: full-http-integration
  cancel-in-progress: false

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: integration

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: poprako
          POSTGRES_USER: poprako
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U poprako -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      INTEGRATION_DATABASE_URL: postgres://poprako:poprako@127.0.0.1:5432/poprako_integration
      JWT_SECRET: ${{ secrets.INTEGRATION_JWT_SECRET }}
      R2_ACCOUNT_ID: ${{ secrets.INTEGRATION_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.INTEGRATION_R2_ACCESS_KEY_ID }}
      R2_BUCKET_NAME: ${{ secrets.INTEGRATION_R2_BUCKET_NAME }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.INTEGRATION_R2_SECRET_ACCESS_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install Diesel CLI
        run: cargo install diesel_cli --version 2.3.7 --no-default-features --features postgres --locked

      - name: Run full HTTP integration suite
        run: sh scripts/api-integration-test.sh
