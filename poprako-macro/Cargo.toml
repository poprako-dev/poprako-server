[package]
name = "poprako-macro"
version = "0.1.0"
edition = "2024"
description = "Project-local proc macros for poprako-r"
license = "MIT"
repository = "https://github.com/anomalyco/poprako-r"
keywords = ["manga", "translation", "proc-macro"]
categories = ["development-tools::procedural-macro-helpers"]
readme = false
publish = false

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full"] }
